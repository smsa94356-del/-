        <!-- قسم إدخال السؤال الديناميكي -->
        <section class="card">
            <h2><i class="fa-solid fa-pen-nib"></i> طرح السؤال أو رفع الورقة</h2>
            
            <!-- حاوية لجعل الرفع والكتابة جنباً إلى جنب -->
            <div class="input-grid">
                <!-- زر رفع الصورة (يدعم المعرض والكاميرا معاً) بدون أي تكرار -->
                <div class="form-group">
                    <label for="scanInput"><i class="fa-solid fa-image"></i> مسح ضوئي / اختيار صورة أو التقاطها:</label>
                    <input type="file" id="scanInput" accept="image/*" onchange="previewImage(event)">
                    <div id="imagePreviewContainer"></div>
                </div>

                <!-- الحقل المتغير حسب المادة (كتابة السؤال) -->
                <div id="dynamicInputContainer" class="form-group">
                    <!-- يتم تعبئته تلقائياً عبر JavaScript -->
                </div>
            </div>

            <button class="btn-submit" onclick="solveQuestion()">الحصول على الإجابة الوزارية</button>
        </section>
